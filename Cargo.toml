[package]
name = "pex"
version = "1.2.4"
edition = "2021"
default-run = "pex"
build = "build.rs"

[dependencies]
# GUI
eframe = { version = "0.28.1", default-features = false, features = ["default_fonts", "glow", "wgpu", "x11", "wayland"] }

# Images & HTTP
image = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# Utils
md5 = "0.7"
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
urlencoding = "2.1"
tempfile = "3.10"
rfd = "0.15"

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "db_explorer"
path = "epg_explorer_tool/db_explorer.rs"

[[bin]]
name = "library_db_explorer"
path = "epg_explorer_tool/library_db_explorer.rs"
