name: First-run checks and portable builds
on:
  workflow_dispatch:
  push:
    branches: [improve-first-run]
permissions:
  contents: read

jobs:
  snapshot-exporter:
    name: Snapshot exporter (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p "test_*.py"

  portable:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - name: Build portable ZIP and verify checksum
        shell: pwsh
        id: bundle
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          . ./scripts/release_helpers.ps1
          $metadata = cargo metadata --locked --offline --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read Cargo package version.' }
          $package = ($metadata | ConvertFrom-Json).packages | Where-Object name -EQ 'pex'
          $tag = Get-ReleaseTag $package.version
          $binary = Build-PexRelease
          $outputDir = "dist/$env:PLATFORM"
          $assetDir = "make_portable/$outputDir"
          $zipName = "pex-portable-$env:PLATFORM-$tag.zip"
          if ($IsWindows) {
            ./make_portable/make_portable.ps1 -BinaryPath $binary -OutputDir $outputDir -Zip -ZipName $zipName
          } else {
            bash ./make_portable/make_portable.sh --binary-path $binary --output-dir $outputDir --zip --zip-name $zipName
            if ($LASTEXITCODE -ne 0) { throw 'Linux packaging failed.' }
          }
          $checksumName = "checksums-$env:PLATFORM-$tag.txt"
          $checksumPath = New-ArtifactChecksums -ArtifactPaths @("$assetDir/$zipName") -OutputPath "$assetDir/$checksumName"
          Test-ArtifactChecksums -ChecksumPath $checksumPath -ArtifactDir $assetDir
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: pex-portable-${{ matrix.platform }}-${{ steps.bundle.outputs.tag }}
          path: |
            make_portable/dist/${{ matrix.platform }}/*.zip
            make_portable/dist/${{ matrix.platform }}/checksums-*.txt
          if-no-files-found: error
